<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">DeepSeek Harness TUI interface preview</title>
  <desc id="description">A dark terminal window showing session details, settings, keyboard controls, and a context usage footer.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10162c"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4d6bfe"/>
      <stop offset="1" stop-color="#73a0ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000814" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#backdrop)"/>
  <circle cx="110" cy="85" r="210" fill="#4d6bfe" opacity="0.08"/>
  <circle cx="1170" cy="650" r="260" fill="#4d6bfe" opacity="0.07"/>

  <g filter="url(#shadow)">
    <rect x="70" y="54" width="1140" height="612" rx="20" fill="#090d18" stroke="#29334b" stroke-width="2"/>
    <path d="M70 74a20 20 0 0 1 20-20h1100a20 20 0 0 1 20 20v40H70z" fill="#151b2b"/>
    <circle cx="105" cy="84" r="7" fill="#ff6b6b"/>
    <circle cx="130" cy="84" r="7" fill="#ffd166"/>
    <circle cx="155" cy="84" r="7" fill="#55d187"/>
    <text x="640" y="90" text-anchor="middle" fill="#8f9ab3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">deepseek — ~/projects/deepseek-harness-tui</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="110" y="166" fill="url(#accent)" font-size="27" font-weight="700">DeepSeek Harness TUI</text>
    <text x="110" y="198" fill="#737f99" font-size="15">session  session-a8f2c1</text>
    <text x="110" y="224" fill="#737f99" font-size="15">cwd      ~/projects/deepseek-harness-tui</text>
    <text x="110" y="258" fill="#7f8ba5" font-size="14">/ commands · F2 settings · Shift+Tab plan/build · Shift+↑/↓ reasoning</text>

    <rect x="110" y="292" width="1060" height="264" rx="12" fill="#0e1422" stroke="#26314a"/>
    <rect x="110" y="292" width="1060" height="46" rx="12" fill="#171f31"/>
    <path d="M110 326h1060v12H110z" fill="#171f31"/>
    <text x="136" y="322" fill="#f2f5ff" font-size="16" font-weight="700">Settings</text>
    <text x="1138" y="322" text-anchor="end" fill="#687590" font-size="13">Esc close</text>

    <rect x="126" y="354" width="1028" height="42" rx="7" fill="#1b2853"/>
    <rect x="126" y="354" width="4" height="42" rx="2" fill="#4d6bfe"/>
    <text x="148" y="381" fill="#8ca2ff" font-size="16">›</text>
    <text x="174" y="381" fill="#f4f6ff" font-size="15">Model</text>
    <text x="1128" y="381" text-anchor="end" fill="#aeb9d3" font-size="15">deepseek-chat</text>

    <text x="174" y="430" fill="#c9d1e4" font-size="15">Reasoning effort</text>
    <text x="1128" y="430" text-anchor="end" fill="#7f98ff" font-size="15">high</text>
    <text x="174" y="474" fill="#c9d1e4" font-size="15">Transcript detail</text>
    <text x="1128" y="474" text-anchor="end" fill="#aeb9d3" font-size="15">normal</text>
    <text x="174" y="518" fill="#c9d1e4" font-size="15">Tool permissions</text>
    <text x="1128" y="518" text-anchor="end" fill="#aeb9d3" font-size="15">workspace-write</text>

    <text x="110" y="599" fill="#4d6bfe" font-size="15">deepseek-chat</text>
    <text x="267" y="599" fill="#8390aa" font-size="15">reason:high</text>
    <text x="386" y="599" fill="#4d6bfe" font-size="15">plan</text>
    <text x="441" y="599" fill="#8390aa" font-size="15">workspace-write</text>
    <text x="610" y="599" fill="#aeb9d3" font-size="15">ctx ~42K/1M (4%)</text>
    <text x="1170" y="599" text-anchor="end" fill="#55d187" font-size="15">ready</text>

    <path d="M110 624h1060" stroke="#222c42"/>
    <text x="110" y="648" fill="#66738e" font-size="13">Terminal-native controls · Durable sessions · Official Harness runtime</text>
    <text x="1170" y="648" text-anchor="end" fill="#4d6bfe" font-size="13">preview</text>
  </g>
</svg>
