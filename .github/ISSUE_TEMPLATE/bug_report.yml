name: Bug report
description: Report a reproducible problem with the TUI or launcher.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, credentials, raw session logs, or other private data. Use GitHub's private vulnerability reporting for security issues.
  - type: input
    id: version
    attributes:
      label: TUI version
      description: Run `deepseek --version`.
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Enter ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Safe diagnostics
      description: Include sanitized errors or configuration details only. Remove secrets, prompts, session content, usernames, and private paths.
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I removed credentials and private session data from this report.
          required: true

